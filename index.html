<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Music">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Music</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- アイコン: SF Symbolsはライセンス上Webで配布できないため、同じ思想(線幅・丸み・塗り/線の対)で描いたオリジナルSVG -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="i-search" viewBox="0 0 24 24"><circle class="s" cx="10.5" cy="10.5" r="6.3" stroke-width="2.3"/><path class="s" d="M15.3 15.3 20.5 20.5" stroke-width="2.5"/></symbol>
<symbol id="i-house" viewBox="0 0 24 24"><path class="f" d="M12 3 2.6 11.3h2.6V20a1 1 0 0 0 1 1h4v-6h3.6v6h4a1 1 0 0 0 1-1v-8.7h2.6z" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect class="s" x="4" y="4" width="6.5" height="6.5" rx="2"/><rect class="s" x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect class="s" x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect class="s" x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/></symbol>
<symbol id="i-radio" viewBox="0 0 24 24"><circle class="f" cx="12" cy="12" r="2.1"/><path class="s" d="M8.6 8.6a4.8 4.8 0 0 0 0 6.8M15.4 8.6a4.8 4.8 0 0 1 0 6.8M5.7 5.7a8.9 8.9 0 0 0 0 12.6M18.3 5.7a8.9 8.9 0 0 1 0 12.6"/></symbol>
<symbol id="i-chevd" viewBox="0 0 24 24"><path class="s" d="m6 9 6 6 6-6" stroke-width="2.4"/></symbol>
<symbol id="i-chevr" viewBox="0 0 24 24"><path class="s" d="m9 6 6 6-6 6" stroke-width="2.4"/></symbol>
<symbol id="i-chevl" viewBox="0 0 24 24"><path class="s" d="m15 6-6 6 6 6" stroke-width="2.4"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path class="s" d="M9 3.5h6l-.9 5.6 3.1 3.2V14h-4.7v5.5L12 21l-.5-1.5V14H6.8v-1.7l3.1-3.2z"/></symbol>

<symbol id="i-mic" viewBox="0 0 24 24"><g transform="rotate(40 12 12)"><rect class="s" x="9" y="3" width="6" height="10.5" rx="3"/><path class="s" d="M6.5 11.5a5.5 5.5 0 0 0 11 0M12 17v3.5"/></g></symbol>
<symbol id="i-stack" viewBox="0 0 24 24"><rect class="s" x="4" y="8.5" width="16" height="11.5" rx="2.6"/><path class="s" d="M7 5.5h10M9.5 3h5"/></symbol>
<symbol id="i-note" viewBox="0 0 24 24"><path class="f" d="M9.5 4.2 19 2.5v13.2a2.9 2.9 0 1 1-1.8-2.7V7.2l-5.9 1.1v9.4a2.9 2.9 0 1 1-1.8-2.7z"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><circle class="s" cx="12" cy="12" r="8.6"/><path class="s" d="M12 7.5v8M8.6 12.6l3.4 3.4 3.4-3.4"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path class="fr" d="M7.5 4.8v14.4c0 .8.9 1.3 1.6.9l11-7.2c.6-.4.6-1.4 0-1.8l-11-7.2c-.7-.4-1.6.1-1.6.9z"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><rect class="f" x="5.8" y="4.5" width="4.4" height="15" rx="1.5"/><rect class="f" x="13.8" y="4.5" width="4.4" height="15" rx="1.5"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path class="fr" d="M12 12l8.5-5.6v11.2zM3.5 12 12 6.4v11.2z"/></symbol>
<symbol id="i-fwd" viewBox="0 0 24 24"><path class="fr" d="M12 12 3.5 6.4v11.2zM20.5 12 12 6.4v11.2z"/></symbol>
<symbol id="i-shuffle" viewBox="0 0 24 24"><path class="s" d="M3 7h3c3 0 4 2 6 5s3 5 6 5h3M3 17h3c1.5 0 2.6-.6 3.6-1.8M14 8.2C15 7.5 16 7 18 7h3M18.5 4.5 21 7l-2.5 2.5M18.5 14.500 21 17l-2.5 2.5"/></symbol>
<symbol id="i-repeat" viewBox="0 0 24 24"><path class="s" d="M4 11v-1a3 3 0 0 1 3-3h12M16.5 4 19.5 7l-3 3M20 13v1a3 3 0 0 1-3 3H5M7.5 20 4.500 17l3-3"/></symbol>
<symbol id="i-repeat1" viewBox="0 0 24 24"><path class="s" d="M4 11v-1a3 3 0 0 1 3-3h12M16.5 4 19.5 7l-3 3M20 13v1a3 3 0 0 1-3 3H5M7.5 20 4.500 17l3-3M11 10.8l1.300-.9v4.600"/></symbol>
<symbol id="i-ellipsis" viewBox="0 0 24 24"><circle class="f" cx="5" cy="12" r="1.9"/><circle class="f" cx="12" cy="12" r="1.9"/><circle class="f" cx="19" cy="12" r="1.9"/></symbol>
<symbol id="i-quote" viewBox="0 0 24 24"><path class="s" d="M5 4.500h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-6l-4.500 3.500V17.500H5a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z"/><circle class="f" cx="9" cy="10.500" r="1.400"/><circle class="f" cx="15" cy="10.500" r="1.400"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path class="s" d="M10 6.500h10M10 12h10M10 17.500h10"/><circle class="f" cx="5" cy="6.500" r="1.300"/><circle class="f" cx="5" cy="12" r="1.300"/><circle class="f" cx="5" cy="17.500" r="1.300"/></symbol>
<symbol id="i-plnote" viewBox="0 0 24 24"><path class="s" d="M3 7h11M3 12h8M3 17h6"/><circle class="f" cx="16.500" cy="17" r="2.300"/><path class="s" d="M18.800 17V7l4-1"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path class="s" d="m12 3.200 2.700 5.600 6.100.8-4.500 4.200 1.100 6.100L12 17l-5.400 2.900 1.100-6.100-4.500-4.200 6.100-.8z"/></symbol>
<symbol id="i-starfill" viewBox="0 0 24 24"><path class="fr" d="m12 3.200 2.700 5.600 6.100.8-4.500 4.200 1.100 6.100L12 17l-5.400 2.900 1.100-6.100-4.500-4.200 6.100-.8z"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path class="s" d="M12 5v14M5 12h14" stroke-width="2.4"/></symbol>
<symbol id="i-sidebar" viewBox="0 0 24 24"><rect class="s" x="3" y="4.500" width="18" height="15" rx="3.500"/><path class="s" d="M9.500 4.500v15"/></symbol>
<symbol id="i-spk" viewBox="0 0 24 24"><path class="fr" d="M4 9.500h3.200L12 5.500v13l-4.800-4H4z"/></symbol>
<symbol id="i-spkw" viewBox="0 0 24 24"><path class="fr" d="M4 9.500h3.200L12 5.500v13l-4.800-4H4z"/><path class="s" d="M15 9a4.500 4.500 0 0 1 0 6M17.500 6.500a8 8 0 0 1 0 11"/></symbol>
<symbol id="i-headphones" viewBox="0 0 24 24"><path class="s" d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect class="f" x="3.500" y="14" width="4" height="6.500" rx="1.800"/><rect class="f" x="16.500" y="14" width="4" height="6.500" rx="1.800"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path class="s" d="M3.500 7a2 2 0 0 1 2-2h4l2 2.200h7a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path class="s" d="M5 7h14M9.500 7V5h5v2M7 7l.8 12h8.400L17 7"/></symbol>
<symbol id="i-xmark" viewBox="0 0 24 24"><path class="s" d="m6 6 12 12M18 6 6 18" stroke-width="2.4"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path class="s" d="m5 12.500 4.500 4.500L19 7.500" stroke-width="2.4"/></symbol>
<symbol id="i-person" viewBox="0 0 24 24"><circle class="f" cx="12" cy="8.500" r="4.200"/><path class="f" d="M4 20.500c.7-3.900 4-5.700 8-5.700s7.300 1.800 8 5.700z"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path class="s" d="M12 15.500v-11M8 8.500l4-4 4 4M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path class="s" d="M10 14a4 4 0 0 0 5.700 0l3-3a4 4 0 0 0-5.700-5.700l-1 1M14 10a4 4 0 0 0-5.700 0l-3 3a4 4 0 0 0 5.700 5.700l1-1"/></symbol>
<symbol id="i-next" viewBox="0 0 24 24"><path class="s" d="M5 12h14M13 6l6 6-6 6"/></symbol>
</defs>
</svg>

<div id="app">
  <div id="bg"></div>
  <aside id="sidebar" class="glass"></aside>
  <div id="scrim"></div>
  <button id="sbopen" class="ib glass round" data-act="sidebar" aria-label="Sidebar"></button>
  <main id="main"></main>
  <div id="mini" class="glass"></div>
  <div id="np"></div>
</div>

<input type="file" id="file" multiple accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.ogg,.opus" hidden>
<div id="menu" class="glass"></div>
<div id="modal"></div>
<div id="toast" class="glass"></div>
<div id="drop"><div class="glass">♪</div></div>
<audio id="au" preload="auto" playsinline></audio>
<script src="app.js"></script>
</body>
</html>
