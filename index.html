<div id="app">
  <div id="bg"></div>
  <aside id="sidebar" class="glass"></aside>
  <div id="topbar"></div>
  <div id="scrim"></div>
  <button id="sbopen" class="ib glass round" data-act="sidebar" aria-label="Sidebar"></button>
  <main id="main"></main>
  <div id="mini" class="glass"></div>
  <div id="np"></div>
</div>

<input type="file" id="file" multiple accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.ogg,.opus" hidden>
<div id="menu" class="glass"></div>
<div id="modal"></div>
<div id="toast" class="glass"></div>
<div id="drop"><div class="glass">♪</div></div>
<audio id="au" preload="auto" playsinline></audio>
<script src="app.js"></script>
</body>
</html>
